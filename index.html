    <!-- Apply saved theme / view before paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var q = new URLSearchParams(location.search).get("view");
          if (localStorage.getItem("theme") === "dark") d.dataset.theme = "dark";
          if (q === "plain" || localStorage.getItem("view") === "plain") d.dataset.view = "plain";
          var a = JSON.parse(localStorage.getItem("a11y") || "{}");
          if (a.size && a.size !== "default") d.dataset.textSize = a.size;
          if (a.contrast) d.dataset.contrast = "high";
          if (a.motion) d.dataset.motion = "reduce";
          if (a.font) {
            d.dataset.font = "readable";
            document.write('<link rel="stylesheet" data-readable-font href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">');
          }
        } catch (e) {}
      })();
    </script>
